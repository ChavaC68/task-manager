<div class="card task-card border-0 shadow-sm">
  <div class="card-body py-3">
    <div class="d-flex justify-content-between align-items-start gap-2">

      <!-- תוכן -->
      <div class="flex-grow-1">
        <h3 class="h6 mb-1 text-break">{{ task().title }}</h3>

        @if (task().description) {
          <p class="text-muted small mb-2 text-break">{{ task().description }}</p>
        }

        <div class="d-flex flex-wrap gap-2 align-items-center">
          <span [class]="priorityBadgeClass()">
            עדיפות: {{ task().priority }}
          </span>

          <span [class]="statusBadgeClass()">
            {{ task().status }}
          </span>

          <span class="small text-muted d-inline-flex align-items-center gap-1">
            <i class="bi bi-calendar-event"></i>
            {{ formattedDueDate() }}
          </span>
        </div>
      </div>

      <!-- פעולות -->
      <div class="d-flex gap-1 flex-shrink-0">
        <button
          type="button"
          class="btn btn-sm btn-outline-primary"
          title="עריכת משימה"
          (click)="onEdit()"
        >
          <i class="bi bi-pencil"></i>
          <span class="visually-hidden">עריכה</span>
        </button>

        <button
          type="button"
          class="btn btn-sm btn-outline-danger"
          title="מחיקת משימה"
          (click)="onDelete()"
        >
          <i class="bi bi-trash"></i>
          <span class="visually-hidden">מחיקה</span>
        </button>
      </div>

    </div>
  </div>
</div>
